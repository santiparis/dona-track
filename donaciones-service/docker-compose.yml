services:
  mysql:
    image: mysql:8.0
    container_name: donaciones-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: donaciones
      MYSQL_USER: donaciones
      MYSQL_PASSWORD: donaciones
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - donaciones_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot"]
      interval: 5s
      timeout: 5s
      retries: 20
  donaciones-api:
    build:
      context: ..
      dockerfile: donaciones-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      LOGISTICA_URL: http://logistica-api:7070/
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  donaciones_mysql_data:
