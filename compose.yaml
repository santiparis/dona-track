
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: donaciones
      MYSQL_USER: donaciones
      MYSQL_PASSWORD: donaciones
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - donaciones_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -P 3306 -u donaciones -pdonaciones -D donaciones -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: logistica
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - logistica_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logistica"]
      interval: 5s
      timeout: 5s
      retries: 20

  donaciones-api:
    build:
      context: .
      dockerfile: donaciones-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      LOGISTICA_URL: http://logistica-api:7070/
      LOGISTICA_GRPC_HOST: logistica-api
      DB_URL: jdbc:mysql://mysql:3306/donaciones
      AZURE_STORAGE_CONTAINER_URL: ${AZURE_STORAGE_CONTAINER_URL:-}
      AZURE_STORAGE_SAS: ${AZURE_STORAGE_SAS:-}
      DONACIONES_URL_PRIVADA: ${DONACIONES_URL_PRIVADA:-http://localhost:8081}
      # Los contenedores corren en UTC: Java toma la zona de acá (historial, notificaciones, crons)
      TZ: America/Argentina/Buenos_Aires
      DONACIONES_URL_PUBLICA: ${DONACIONES_URL_PUBLICA:-http://localhost:8081}
    depends_on:
      mysql:
        condition: service_healthy
    # Claves de SendGrid y Twilio (fuera de git); sin los archivos, el envío queda simulado
    env_file:
      - path: sendgrid.env
        required: false
      - path: twilio.env
        required: false

  logistica-api:
    build:
      context: .
      dockerfile: logistica-service/Dockerfile
      target: logistica-api
    ports:
      - "7070:7070"
    environment:
      DONACIONES_URL_PRIVADA: http://donaciones-api:8081/
      PLANIFICADOR_URL: http://mock-planificador:9092/
      DONACIONES_GRPC_HOST: donaciones-api
      DB_URL: jdbc:postgresql://postgres:5432/logistica
      TZ: America/Argentina/Buenos_Aires
    depends_on:
      postgres:
        condition: service_healthy

  planificador:
    build:
      context: .
      dockerfile: logistica-service/Dockerfile
      target: planificador
    environment:
      LOGISTICA_URL: http://logistica-api:7070
      TZ: America/Argentina/Buenos_Aires
    depends_on:
      - logistica-api
    restart: "no"

  mock-gps:
    build:
      context: .
      dockerfile: logistica-service/Dockerfile
      target: mock-gps
    environment:
      LOGISTICA_URL: http://logistica-api:7070/
      TZ: America/Argentina/Buenos_Aires
    depends_on:
      - logistica-api
    restart: unless-stopped

  mock-planificador:
    build:
      context: .
      dockerfile: logistica-service/Dockerfile
      target: mock-planificador
    environment:
      LOGISTICA_URL: http://logistica-api:7070/
      TZ: America/Argentina/Buenos_Aires
    depends_on:
      - logistica-api
    restart: unless-stopped
volumes:
  donaciones_mysql_data:
  logistica_postgres_data:
